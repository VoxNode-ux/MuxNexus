name: Release

# Manual only: Actions tab -> Release -> Run workflow -> type the version (e.g. 1.0.0).
# It builds the files and creates the GitHub Release with them attached.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. 1.0.0 or v1.0.0-beta.1 (created if it does not exist)'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        name: Tag must look like 1.2.3, v1.2.3 or 1.2.3-beta.1
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG'. Use e.g. 1.0.0 or v1.0.0"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
    with:
      build_cli: true
      version: ${{ needs.validate.outputs.tag }}

  publish:
    name: Attest & publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create / update the release
      actions: read         # download this run's artifacts with gh
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - name: Collect build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --dir dl --pattern 'build-*'
          mkdir release-files
          find dl -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Verify checksums and contents
        working-directory: release-files
        run: |
          for f in *.sha256; do shasum -a 256 -c "$f"; done
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            ls ./*"$abi"*.apk > /dev/null || { echo "::error::Missing $abi APK"; exit 1; }
          done
          echo "CLI archives present:"; ls ./*.tar.gz 2>/dev/null || echo "(none - desktop builds failed)"

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release-files/*.apk
            release-files/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: MuxNexus ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-files/*.apk
            release-files/*.tar.gz
            release-files/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          overwrite_files: true