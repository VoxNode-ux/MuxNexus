name: Release (Debug APK)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.0.12433566" "cmake;3.22.1" > /dev/null
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.0.12433566" "cmake;3.22.1" > /dev/null
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  build-and-publish:
    name: Build & Publish Debug APK
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.0.12433566" "cmake;3.22.1" > /dev/null

      - name: Cache FFmpeg static libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ffmpeg
          key: ffmpeg-n6.1.1-abi3-v1

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x native-build/build_ffmpeg.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12433566"
          ./native-build/build_ffmpeg.sh android

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Compute checksums
        working-directory: app/build/outputs/apk/debug
        run: |
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}