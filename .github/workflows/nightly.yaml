name: nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.0.12433566" "cmake;3.22.1" > /dev/null
      - uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ffmpeg
          key: ffmpeg-n6.1.1-abi3-v1
      - name: FFmpeg
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.12433566
        run: ./native-build/build_ffmpeg.sh android
      - name: Assemble
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-apk
          path: app/build/outputs/apk/debug/*.apk