name: nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/cpp/ffmpeg
          key: ffmpeg-n6.1.6-abi3-v4
      - name: FFmpeg
        run: |
          chmod +x native-build/build_ffmpeg.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./native-build/build_ffmpeg.sh android
      - name: Assemble
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-apk
          path: app/build/outputs/apk/debug/*.apk