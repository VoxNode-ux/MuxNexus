name: codeql

# Manual, plus one scheduled run every Monday. Does not run on push or pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin/Java is built by hand: the automatic build runs `gradlew assemble`,
          # which also compiles the native library and needs the FFmpeg static libraries
          # (not present here). Compiling only the Kotlin and Java sources is enough.
          - language: java-kotlin
            build-mode: manual
          - language: cpp
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Kotlin and Java sources
        if: matrix.build-mode == 'manual'
        run: |
          ./gradlew --no-daemon --no-build-cache --console=plain clean \
            :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.build-mode == 'autobuild'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"