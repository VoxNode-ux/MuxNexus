name: test-native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/test-native.yaml']
  pull_request:
    paths: ['native/**', '.github/workflows/test-native.yaml']

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev
      - run: cmake -S native -B build -G Ninja -DMUXNEXUS_BUILD_TESTS=ON
      - run: cmake --build build
      - run: bash ./native/tests/fixtures/generate.sh
      - run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: brew install cmake ninja pkg-config ffmpeg
      - run: cmake -S native -B build -G Ninja -DMUXNEXUS_BUILD_TESTS=ON
      - run: cmake --build build
      - run: bash ./native/tests/fixtures/generate.sh
      - run: ctest --test-dir build --output-on-failure

  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja pkgconf ffmpeg git
          run: |
            cmake -S native -B build -G Ninja -DMUXNEXUS_BUILD_TESTS=ON
            cmake --build build
            bash ./native/tests/fixtures/generate.sh
            ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev
      - env:
          CC: clang
          CXX: clang++
        run: cmake -S native -B build-fuzz -G Ninja -DMUXNEXUS_BUILD_FUZZ=ON
      - run: cmake --build build-fuzz
      - run: ./build-fuzz/fuzz/fuzz_fingerprint -max_total_time=30 -print_final_stats=1
      - run: ./build-fuzz/fuzz/fuzz_demux -max_total_time=60 -print_final_stats=1