name: test-android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  instrumented:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain