name: Pin helper (looks up versions, changes nothing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look up commit SHAs for every GitHub Action in the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[A-Za-z0-9_.-]+' .github/workflows \
            | sed 's/^uses: //' | sort -u > refs.txt
          while read -r ref; do
            path="${ref%@*}"
            tag="${ref#*@}"
            repo=$(echo "$path" | cut -d/ -f1-2)
            if echo "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "already pinned: $ref"
              continue
            fi
            sha=$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null || true)
            if [ -z "$sha" ]; then
              echo "NOT FOUND: $ref"
            else
              echo "uses: $path@$sha # $tag"
            fi
          done < refs.txt | tee actions-pinned.txt

      - name: Look up commit SHAs for FFmpeg and doctest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ff_tag=$(grep -oE 'FFMPEG_VERSION="[^"]+"' native-build/build_ffmpeg.sh | cut -d'"' -f2)
          dt_tag=$(grep -oE 'GIT_TAG +v[0-9.]+' native/tests/CMakeLists.txt | awk '{print $2}')
          {
            echo "FFmpeg  $ff_tag  $(gh api "repos/FFmpeg/FFmpeg/commits/$ff_tag" --jq .sha 2>/dev/null || echo NOT FOUND)"
            echo "doctest $dt_tag  $(gh api "repos/doctest/doctest/commits/$dt_tag" --jq .sha 2>/dev/null || echo NOT FOUND)"
          } | tee native-pinned.txt

      - name: Show everything in one readable summary
        if: always()
        run: |
          {
            echo "## 1. GitHub Actions (replace each uses: line with the matching line below)"
            echo '```'
            cat actions-pinned.txt 2>/dev/null || echo "(no result)"
            echo '```'
            echo "## 2. Native deps (use the commit hash instead of the tag)"
            echo '```'
            cat native-pinned.txt 2>/dev/null || echo "(no result)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pinned-versions
          path: |
            actions-pinned.txt
            native-pinned.txt
          if-no-files-found: ignore
          retention-days: 30